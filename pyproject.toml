[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-rag"
version = "0.1.0"
description = "Local-first job description collection and normalization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
experiment = [
    "accelerate>=1,<2",
    "FlagEmbedding>=1.3,<2",
    "huggingface-hub>=0.30,<2",
    "numpy>=1.26,<3",
    "torch>=2.3,<3",
    "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
